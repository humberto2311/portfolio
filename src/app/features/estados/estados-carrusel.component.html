<section class="estados" [class.estados--compacta]="compacto()" aria-label="Estados">
  @if (!ocultarCabecera()) {
    <div class="estados__cabecera">
      <h3>Estados</h3>
      <button type="button" class="estados__crear" (click)="crear()">
        <i class="fa-solid fa-plus" aria-hidden="true"></i>
        Crear estado
      </button>
    </div>
  }

  <div class="estados__fila">
    <button type="button" class="estado-tarjeta estado-tarjeta--crear" (click)="verMio()">
      <span class="anillo anillo--crear" [class.anillo--propio]="mio()">
        @if (avatarPropio(); as foto) {
          @if (!avatarRoto()) {
            <img [src]="foto" alt="Tu estado" (error)="avatarRoto.set(true)" />
          } @else {
            <span class="anillo__iniciales">{{ iniciales() }}</span>
          }
        } @else {
          <span class="anillo__iniciales">{{ iniciales() }}</span>
        }
        <span class="anillo__mas" aria-hidden="true"><i class="fa-solid fa-plus"></i></span>
      </span>
      @if (notaPropia(); as nota) {
        <span class="estado-tarjeta__burbuja">{{ nota }}</span>
      }
      <span class="estado-tarjeta__nombre">{{ etiquetaPropia() }}</span>
    </button>

    @for (grupo of otros(); track grupo.usuarioId) {
      <div class="estado-tarjeta" [class.estado-tarjeta--sin-nota]="!textoDe(grupo)">
        <button type="button" class="estado-tarjeta__anillo" (click)="chatear(grupo)"
                [title]="'Abrir el chat con ' + grupo.nombre"
                [attr.aria-label]="'Abrir el chat con ' + grupo.nombre">
        <span class="anillo" [class.anillo--visto]="grupo.todosVistos">
          @if (grupo.avatar && !roto(grupo.usuarioId)) {
            <img [src]="grupo.avatar" [alt]="grupo.nombre" (error)="marcarRoto(grupo.usuarioId)" />
          } @else {
            <span class="anillo__iniciales">{{ grupo.nombre.slice(0, 2).toUpperCase() }}</span>
          }
        </span>
        </button>
        @if (textoDe(grupo); as nota) {
          <span class="estado-tarjeta__burbuja">{{ nota }}</span>
        }
        <button type="button" class="estado-tarjeta__nombre estado-tarjeta__nombre--boton"
                (click)="chatear(grupo)" [title]="'Abrir el chat con ' + grupo.nombre">
          {{ grupo.nombre.split(' ')[0] }}
        </button>
        @if (grupo.estados.length) {
          <button type="button" class="estado-tarjeta__historia" (click)="ver(grupo)"
                  [title]="'Ver la historia de ' + grupo.nombre">Ver historia</button>
        }
      </div>
    }

    @if (!cargando() && otros().length === 0) {
      <p class="estados__vacio">Aún no hay estados de tus contactos. Crea el tuyo.</p>
    }
  </div>
</section>
