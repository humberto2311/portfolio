<section class="estados" [class.estados--compacta]="compacto()" aria-label="Estados">
  @if (!ocultarCabecera()) {
    <div class="estados__cabecera">
      <h3>Estados</h3>
      <button type="button" class="estados__crear" (click)="crear()">
        <i class="fa-solid fa-plus" aria-hidden="true"></i>
        Crear estado
      </button>
    </div>
  }

  <div class="estados__fila">
    <!-- El mapa abre la fila, pegado al avatar del usuario logueado. -->
    @if (mapa()) {
      <a class="estado-tarjeta estado-tarjeta--mapa" routerLink="/app/ubicacion"
         title="Mapa de conexiones" aria-label="Abrir el mapa de conexiones">
        <span class="anillo anillo--mapa">
          <i class="fa-solid fa-map-location-dot" aria-hidden="true"></i>
        </span>
        <span class="estado-tarjeta__nombre">Mapa</span>
      </a>
    }

    <button type="button" class="estado-tarjeta estado-tarjeta--crear" (click)="tocarPropio()"
            [title]="propiaEsNota() ? 'Escribe o edita tu nota' : 'Ver tu historia'">
      <span class="anillo anillo--crear" [class.anillo--propio]="mio()" [class.diseno-visita]="disenoPropio()">
        @if (avatarPropio(); as foto) {
          @if (!avatarRoto()) {
            <img [src]="foto" alt="Tu foto" (error)="avatarRoto.set(true)" />
          } @else {
            <span class="anillo__iniciales">{{ iniciales() }}</span>
          }
        } @else {
          <span class="anillo__iniciales">{{ iniciales() }}</span>
        }
        @if (!propiaEsNota()) {
          <span class="anillo__mas" aria-hidden="true"><i class="fa-solid fa-plus"></i></span>
        }
      </span>
      @if (conNota() && notaPropia(); as nota) {
        <span class="estado-tarjeta__burbuja">{{ nota }}</span>
      }
      <span class="estado-tarjeta__nombre">{{ propiaEsNota() ? 'Tu nota' : etiquetaPropia() }}</span>
    </button>

    @for (grupo of otros(); track grupo.usuarioId) {
      <div class="estado-tarjeta" [class.estado-tarjeta--sin-nota]="!textoDe(grupo)">
        <button type="button" class="estado-tarjeta__anillo" (click)="ver(grupo)"
                [title]="grupo.estados.length ? 'Ver la historia de ' + grupo.nombre : 'Abrir el chat con ' + grupo.nombre"
                [attr.aria-label]="grupo.estados.length ? 'Ver la historia de ' + grupo.nombre : 'Abrir el chat con ' + grupo.nombre">
        <span class="anillo" [class.anillo--visto]="grupo.todosVistos" [class.diseno-visita]="disenoPropio()">
          @if (grupo.avatar && !roto(grupo.usuarioId)) {
            <img [src]="grupo.avatar" [alt]="grupo.nombre" (error)="marcarRoto(grupo.usuarioId)" />
          } @else {
            <span class="anillo__iniciales">{{ grupo.nombre.slice(0, 2).toUpperCase() }}</span>
          }
        </span>
        </button>
        @if (conNota() && notaDe(grupo); as nota) {
          <span class="estado-tarjeta__burbuja">{{ nota }}</span>
        }
        <button type="button" class="estado-tarjeta__nombre estado-tarjeta__nombre--boton"
                (click)="chatear(grupo)" [title]="'Abrir el chat con ' + grupo.nombre">
          {{ grupo.nombre.split(' ')[0] }}
        </button>
      </div>
    }

    @if (!cargando() && otros().length === 0) {
      <p class="estados__vacio">Aún no hay estados de tus contactos. Crea el tuyo.</p>
    }
  </div>
</section>
