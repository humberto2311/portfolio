<div class="feed">
  @if (cargando()) {
    <div class="loader">
      <span class="spinner"></span>
      <span>Cargando feed...</span>
    </div>
  } @else {
    <app-crear-post />

    @for (post of publicacionesVisibles(); track post.uid) {
      <app-post-card [post]="post" />
    }
  }

  <app-toast />
</div>
