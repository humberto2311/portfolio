<div class="crear-post">
  <div class="input-row">
    <div class="avatar">
      @if (miAvatar()) {
        <img [src]="miAvatar()" [alt]="'Mi foto'" />
      } @else {
        {{ inicialesUsuario }}
      }
    </div>

    <div class="input-wrap">
      <input
        type="text"
        [(ngModel)]="texto"
        appMenciones
        (keydown.enter)="publicar()"
        placeholder="¿Qué estás desarrollando hoy? Escribe @ para mencionar a alguien"
        class="text-input" />
    </div>
  </div>

  @if (imagenPreview()) {
    <div class="preview">
      <img [src]="imagenPreview()!" alt="preview" />
      <button class="btn-remove" (click)="limpiarImagen()">
        <i class="fa-solid fa-xmark"></i>
      </button>
    </div>
  }

  <div class="actions">
    <button class="btn-media" (click)="abrirPicker()">
      <i class="fa-solid fa-image"></i> Foto / Video
    </button>
    <input type="file" id="post-image-input" hidden accept="image/*" (change)="onFile($event)">
    <button class="btn-publish" [disabled]="publicando()" (click)="publicar()">
      {{ publicando() ? 'Enviando…' : (destinoAjeno ? 'Enviar solicitud' : 'Publicar') }}
    </button>
  </div>

  @if (destinoAjeno) {
    <p class="aviso-destino">
      <i class="fa-solid fa-clock"></i>
      Quedará pendiente hasta que el dueño del perfil la acepte.
    </p>
  }
</div>
