<div class="header-card">
  <div class="cover-banner" [style.background-image]="perfil.coverUrl ? 'url(' + perfil.coverUrl + ')' : 'none'">
    @if (esMiPerfil) {
      <button type="button" class="btn-edit-cover" (click)="emitirAccion('Modificar portada próximamente')">
        <i class="fa-solid fa-camera"></i> Editar Portada
      </button>
    }
  </div>

  <div class="header-body">
    <div class="header-row">
      <!-- AVATAR -->
      <div class="avatar-block">
        <div class="avatar-wrapper" [class.has-image]="perfil.avatarUrl">
          @if (perfil.avatarUrl) {
            <img [src]="perfil.avatarUrl" alt="avatar" class="profile-img" />
          } @else {
            <span class="initials">{{ perfil.iniciales }}</span>
          }
        </div>
      </div>

      <!-- INFO -->
      <div class="user-info">
        <div class="name-row">
          <h1>{{ perfil.nombre }}</h1>
          <i class="fa-solid fa-circle-check verified" title="Verificado"></i>
        </div>
        <p class="rol">{{ perfil.rol }}</p>
        <span class="badge-status">
          <span class="dot"></span> {{ perfil.estado }}
        </span>
      </div>

      <!-- ACCIONES -->
      <div class="actions">
        @if (!esMiPerfil) {
          
          @if (verificandoEstado) {
            <button type="button" class="btn-follow skeleton" disabled>
              <i class="fa-solid fa-spinner fa-spin"></i>
            </button>
          } @else {
            <button 
              type="button" 
              class="btn-follow" 
              [class.following]="isFollowing"
              [disabled]="cargandoAccion"
              (click)="toggleFollow()">
              
              @if (cargandoAccion) {
                <i class="fa-solid fa-spinner fa-spin"></i>
              } @else {
                <i class="fa-solid" [class.fa-user-plus]="!isFollowing" [class.fa-user-check]="isFollowing"></i>
              }
              {{ isFollowing ? 'Siguiendo' : 'Seguir' }}
            </button>
          }

          <button type="button" class="btn-outline" (click)="onMensaje()">
            <i class="fa-regular fa-paper-plane"></i> Mensaje
          </button>
        }

        <button type="button" class="btn-primary" (click)="accionCv.emit()">
          <i class="fa-solid fa-file-arrow-down"></i> Hoja de Vida
        </button>
        
        <button type="button" class="btn-outline" (click)="accionProyectos.emit()">
          <i class="fa-solid fa-code"></i> Proyectos
        </button>
      </div>
    </div>
  </div>
</div>
