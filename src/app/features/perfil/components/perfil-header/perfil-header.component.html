<div class="header-card">
  <div class="cover-banner" [style.background-image]="perfil.coverUrl ? 'url(' + perfil.coverUrl + ')' : 'none'">
    @if (esMiPerfil) {
      <button class="btn-edit-cover" (click)="emitirAccion('Modificar portada próximamente')">
        <i class="fa-solid fa-camera"></i> Editar Portada
      </button>
    }
  </div>

  <div class="header-body">
    <div class="header-row">
      <div class="avatar-block">
        <div class="avatar-wrapper">
          @if (perfil.avatarUrl) {
            <img [src]="perfil.avatarUrl" alt="avatar" />
          } @else {
            <span class="initials">{{ perfil.iniciales }}</span>
          }
        </div>
      </div>

      <div class="user-info">
        <div class="name-row">
          <h1>{{ perfil.nombre }}</h1>
          <i class="fa-solid fa-circle-check verified"></i>
        </div>
        <p class="rol">{{ perfil.rol }}</p>
        <span class="badge-status">
          <span class="dot"></span> {{ perfil.estado }}
        </span>
      </div>

      <div class="actions">
        <button class="btn-primary" (click)="accionCv.emit()">
          <i class="fa-solid fa-file-arrow-down"></i> Hoja de Vida
        </button>
        <button class="btn-outline" (click)="accionProyectos.emit()">
          <i class="fa-solid fa-code"></i> Proyectos
        </button>
      </div>
    </div>
  </div>
</div>
