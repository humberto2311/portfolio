<nav class="tabs-nav">
  @for (tab of listaTabs; track tab.id) {
    <button
      class="tab-btn"
      [class.active]="tabActiva === tab.id"
      [class.oculto-movil]="tab.soloPc"
      (click)="seleccionar(tab.id)">
      <i class="fa-solid" [ngClass]="tab.icon"></i>
      <span>{{ tab.label }}</span>
    </button>
  }
</nav>
