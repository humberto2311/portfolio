<div class="feed-layout">
  <aside class="side-col">
    <div class="side-card">
      <h3><i class="fa-solid fa-user-check"></i> Detalles de Perfil</h3>
      <p class="text-muted">Apasionado por crear software escalable e interfaces futuristas.</p>
    </div>
  </aside>

  <main class="feed-col">
    <app-crear-post />
    @for (post of publicaciones(); track post.id) {
      <app-post-card [post]="post" />
    }
    @if (publicaciones().length === 0) {
      <p class="empty">Aún no hay publicaciones.</p>
    }
  </main>
</div>
