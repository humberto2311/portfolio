@if (svc.importandoCv()) {
  <div class="cv-fondo" (click)="cerrar()"></div>

  <div class="cv-modal" role="dialog" aria-modal="true" aria-labelledby="cv-titulo">
    <header class="cv-modal__cabecera">
      <span class="cv-modal__icono"><i class="fa-solid fa-file-pdf" aria-hidden="true"></i></span>
      <div class="cv-modal__titulo">
        <h3 id="cv-titulo">Importar Hoja de Vida</h3>
        <p>Lectura con Inteligencia Artificial</p>
      </div>
      <button type="button" class="cv-modal__cerrar" aria-label="Cerrar" (click)="cerrar()">
        <i class="fa-solid fa-xmark" aria-hidden="true"></i>
      </button>
    </header>

    <div class="cv-modal__cuerpo">
      <app-pdf-upload />
    </div>
  </div>
}
