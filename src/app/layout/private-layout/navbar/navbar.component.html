<header class="topbar">
  <a class="topbar__marca" routerLink="/app" aria-label="Inicio">
    <app-logo />
  </a>

  <div class="topbar__busqueda">
    <div class="campo">
      <i class="fa-solid fa-magnifying-glass campo__icono" aria-hidden="true"></i>
      <input
        #campo
        type="search"
        placeholder="Buscar personas"
        aria-label="Buscar personas por nombre o usuario"
        autocomplete="off"
        [value]="searchQuery"
        (input)="onSearchInput(campo.value)"
        (keydown)="onKeydown($event)"
      />
      @if (searchQuery) {
        <button type="button" class="campo__limpiar" aria-label="Limpiar búsqueda" (click)="limpiar(campo)">
          <i class="fa-solid fa-xmark" aria-hidden="true"></i>
        </button>
      }
    </div>

    @if (mostrarSugerencias()) {
      <div class="popover">
        <div class="filtros" role="tablist">
          @for (f of filtros; track f) {
            <button
              type="button"
              role="tab"
              class="filtro"
              [class.activo]="filtro() === f"
              (click)="cambiarFiltro(f)">
              {{ f }}
            </button>
          }
        </div>

        <ul class="resultados">
          @for (s of visibles(); track s.username; let i = $index) {
            <li>
              <button
                type="button"
                [class.activo]="i === indice()"
                (mouseenter)="indice.set(i)"
                (click)="irAPerfil(s)">
                <span class="resultados__avatar">
                  @if (s.avatarUrl) {
                    <img [src]="s.avatarUrl" [alt]="'Foto de ' + s.nombre" />
                  } @else {
                    {{ s.iniciales }}
                  }
                </span>
                <span class="resultados__datos">
                  <strong>{{ s.nombre }}</strong>
                  <small>&#64;{{ s.username }}</small>
                </span>
                <span class="resultados__relacion" [class.otro]="s.relacion === 'Sugerido'">{{ s.relacion }}</span>
              </button>
            </li>
          }
          @if (visibles().length === 0) {
            <li class="resultados__vacio">Nadie con esa relación</li>
          }
        </ul>
      </div>
    }
  </div>

  <div class="topbar__acciones">
    <app-notificaciones />
    <app-user-menu />
  </div>
</header>
