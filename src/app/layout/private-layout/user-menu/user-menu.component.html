<div class="user-menu-wrapper">
  <button class="avatar-btn" (click)="toggleMenu()" aria-label="Menú de usuario">
    <span class="initials">{{ getInitials() }}</span>
  </button>

  @if (menuOpen()) {
    <div class="dropdown" (click)="$event.stopPropagation()">
      <div class="dropdown-header">
        <strong>{{ user()?.fullName }}</strong>
        <small>{{ user()?.email }}</small>
      </div>
      
      <hr />
      
      <button (click)="goTo('/ajustes/perfil')">
        <i class="fas fa-user"></i> Mi perfil
      </button>
      
      <button (click)="goTo('/ajustes/cuenta')">
        <i class="fas fa-cog"></i> Ajustes de cuenta
      </button>
      
      <button (click)="goTo('/ajustes/seguridad')">
        <i class="fas fa-shield-alt"></i> Seguridad
      </button>
      
      <hr />
      
      <button class="logout" (click)="logout()">
        <i class="fas fa-sign-out-alt"></i> Cerrar sesión
      </button>
    </div>
  }
</div>
