<!-- Overlay -->
<div
  class="modal-overlay"
  *ngIf="modalSvc.isLoginOpen()"
  (click)="close()"
  role="dialog"
  aria-modal="true">

  <div class="modal-card" (click)="$event.stopPropagation()">

    <!-- Cerrar -->
    <button class="modal-close" (click)="close()" aria-label="Cerrar">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor">
        <path d="M19 6.41 17.59 5 12 10.59 6.41 5 5 6.41 10.59 12 5 17.59 6.41 19 12 13.41 17.59 19 19 17.59 13.41 12z"/>
      </svg>
    </button>

    <!-- Tabs -->
    <div class="modal-tabs">
      <button
        [class.active]="modalSvc.loginTab() === 'login'"
        (click)="switchTab('login')">
        Iniciar sesión
      </button>
      <button
        [class.active]="modalSvc.loginTab() === 'register'"
        (click)="switchTab('register')">
        Crear cuenta
      </button>
    </div>

    <!-- OAuth -->
    <div class="oauth-buttons">
      <button class="oauth-btn github" (click)="auth.loginWithProvider('github')">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor">
          <path d="M12 .3a12 12 0 0 0-3.8 23.4c.6.1.8-.3.8-.6v-2c-3.3.7-4-1.6-4-1.6-.5-1.4-1.3-1.8-1.3-1.8-1.1-.7.1-.7.1-.7 1.2.1 1.8 1.2 1.8 1.2 1.1 1.8 2.8 1.3 3.5 1 .1-.8.4-1.3.8-1.6-2.7-.3-5.5-1.3-5.5-6 0-1.3.5-2.4 1.2-3.2-.1-.3-.5-1.5.1-3.2 0 0 1-.3 3.3 1.2a11.5 11.5 0 0 1 6 0c2.3-1.5 3.3-1.2 3.3-1.2.6 1.7.2 2.9.1 3.2.8.8 1.2 1.9 1.2 3.2 0 4.7-2.8 5.7-5.5 6 .4.4.8 1.1.8 2.2v3.3c0 .3.2.7.8.6A12 12 0 0 0 12 .3"/>
        </svg>
        Continuar con GitHub
      </button>

      <button class="oauth-btn google" (click)="auth.loginWithProvider('google')">
        <svg width="18" height="18" viewBox="0 0 24 24">
          <path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92a5.06 5.06 0 0 1-2.2 3.32v2.77h3.57c2.08-1.92 3.27-4.74 3.27-8.1z"/>
          <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84A11 11 0 0 0 12 23z"/>
          <path fill="#FBBC05" d="M5.84 14.1a6.6 6.6 0 0 1 0-4.2V7.06H2.18a11 11 0 0 0 0 9.88l3.66-2.84z"/>
          <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1A11 11 0 0 0 2.18 7.06l3.66 2.84C6.71 7.3 9.14 5.38 12 5.38z"/>
        </svg>
        Continuar con Google
      </button>

      <button class="oauth-btn microsoft" (click)="auth.loginWithProvider('microsoft')">
        <svg width="18" height="18" viewBox="0 0 24 24">
          <path fill="#f25022" d="M1 1h10v10H1z"/>
          <path fill="#7fba00" d="M13 1h10v10H13z"/>
          <path fill="#00a4ef" d="M1 13h10v10H1z"/>
          <path fill="#ffb900" d="M13 13h10v10H13z"/>
        </svg>
        Continuar con Outlook
      </button>
    </div>

    <div class="divider"><span>o</span></div>

    <!-- Formulario email/password -->
    <form [formGroup]="form" (ngSubmit)="submit()" class="email-form">

      <!-- CAMPOS EXCLUSIVOS DE REGISTRO -->
      <ng-container *ngIf="modalSvc.loginTab() === 'register'">
        
        <label>
          <span>Nombre completo</span>
          <input type="text" formControlName="name" placeholder="Humberto Lozano" autocomplete="name">
        </label>

        <div class="form-row">
          <label>
            <span>Teléfono</span>
            <input type="tel" formControlName="phone" placeholder="+57 300..." autocomplete="tel">
          </label>

          <label>
            <span>Género</span>
            <select formControlName="gender">
              <option value="" disabled selected>Selecciona</option>
              <option value="masculino">Masculino</option>
              <option value="femenino">Femenino</option>
              <option value="otro">Otro</option>
              <option value="prefiero_no_decir">Prefiero no decir</option>
            </select>
          </label>
        </div>

        <label>
          <span>Fecha de nacimiento</span>
          <input type="date" formControlName="birthDate" [max]="maxDate">
        </label>

        <div class="divider" style="margin: 0.5rem 0;"><span>datos de acceso</span></div>
      </ng-container>

      <!-- CAMPOS PARA TODOS (LOGIN Y REGISTRO) -->
      <label>
        <span>Correo electrónico</span>
        <input type="email" formControlName="email" placeholder="tu@correo.com" autocomplete="email">
      </label>

      <label>
        <span>Contraseña</span>
        <div class="input-password">
          <input
            [type]="showPassword() ? 'text' : 'password'"
            formControlName="password"
            placeholder="Mínimo 8 caracteres"
            [autocomplete]="modalSvc.loginTab() === 'login' ? 'current-password' : 'new-password'">
          <button type="button" (click)="showPassword.set(!showPassword())" tabindex="-1">
            {{ showPassword() ? '🙈' : '👁️' }}
          </button>
        </div>
      </label>

      <p class="error" *ngIf="auth.error()">{{ auth.error() }}</p>

      <button type="submit" class="submit-btn" [disabled]="auth.isLoading()">
        {{ auth.isLoading() ? 'Cargando…' : (modalSvc.loginTab() === 'login' ? 'Entrar' : 'Crear cuenta') }}
      </button>

      <a *ngIf="modalSvc.loginTab() === 'login'" class="forgot" href="/recuperar">
        ¿Olvidaste tu contraseña?
      </a>
    </form>
  </div>
</div>
