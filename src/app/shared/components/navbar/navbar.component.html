<header class="navbar-header" [class.is-scrolled]="isScrolled">
  <nav class="navbar-container">

    <!-- BRANDING: NFC-Soft + Identidad Personal -->
    <a [routerLink]="['/']" class="navbar-brand" (click)="closeMenus()">
      
      <!-- 1. Logo de la Empresa -->
      <div class="brand-company">
        <img src="assets/images/logo.png" alt="NFC-Soft Logo" class="brand-logo">
      </div>

      <!-- 2. Divisor Visual (Línea Cyan) -->
      <div class="brand-divider"></div>

      <!-- 3. Identidad Personal -->
      <div class="brand-personal">
        <span class="person-name">Humberto Lozano</span>
        <span class="person-role">Backend Developer</span>
      </div>

    </a>

    <!-- Botón Hamburguesa para Mobile -->
    <button 
      class="mobile-toggle" 
      (click)="toggleMobileMenu()" 
      [attr.aria-expanded]="isMobileMenuOpen"
      aria-label="Abrir menú de navegación">
      <span class="hamburger-bar"></span>
      <span class="hamburger-bar"></span>
      <span class="hamburger-bar"></span>
    </button>

    <!-- Menú Principal de Enlaces -->
    <div class="navbar-links" [class.active]="isMobileMenuOpen">
      <ul>
        <!-- 1. Información Personal -->
        <li>
          <a 
            [routerLink]="['/informacion-personal']" 
            routerLinkActive="active-link"
            (click)="closeMenus()">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor">
              <path d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"/>
            </svg>
            Información Personal
          </a>
        </li>

        <!-- 2. Proyectos & Código -->
        <li>
          <a 
            [routerLink]="['/proyectos']" 
            routerLinkActive="active-link"
            (click)="closeMenus()">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor">
              <path d="M10 4H4c-1.1 0-2 .9-2 2v12c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2V8c0-1.1-.9-2-2-2h-8l-2-2z"/>
            </svg>
            Proyectos & Código
          </a>
        </li>

        <!-- 3. GitHub (Destacado Outline Cyan) -->
        <li>
          <a 
            [href]="githubUrl" 
            target="_blank" 
            rel="noopener noreferrer" 
            class="github-link"
            (click)="closeMenus()">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor">
              <path d="M12 0C5.37 0 0 5.37 0 12c0 5.31 3.435 9.795 8.205 11.385.6.105.825-.255.825-.57 0-.285-.015-1.23-.015-2.235-3.015.555-3.795-.735-4.035-1.41-.135-.345-.72-1.41-1.23-1.695-.42-.225-1.02-.78-.015-.795.945-.015 1.62.87 1.845 1.23 1.08 1.815 2.805 1.305 3.495.99.105-.78.42-1.305.765-1.605-2.67-.3-5.46-1.335-5.46-5.925 0-1.305.465-2.385 1.23-3.225-.12-.3-.54-1.53.12-3.18 0 0 1.005-.315 3.3 1.23.96-.27 1.98-.405 3-.405s2.04.135 3 .405c2.295-1.56 3.3-1.23 3.3-1.23.66 1.65.24 2.88.12 3.18.765.84 1.23 1.905 1.23 3.225 0 4.605-2.805 5.625-5.475 5.925.435.375.81 1.095.81 2.22 0 1.605-.015 2.895-.015 3.3 0 .315.225.69.825.57A12.02 12.02 0 0 0 24 12c0-6.63-5.37-12-12-12z"/>
            </svg>
            GitHub
          </a>
        </li>

       

        <!-- 5. LOGIN (Al final, abre en nueva pestaña) -->
        <li>
          <a 
            [routerLink]="['/login']" 
            target="_blank" 
            class="login-link" 
            (click)="closeMenus()">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor">
              <path d="M11 7L9.6 8.4l2.6 2.6H2v2h10.2l-2.6 2.6L11 17l5-5-5-5zm9 12h-8v2h8c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2h-8v2h8v14z"/>
            </svg>
            Login
          </a>
        </li>
      </ul>
    </div>

  </nav>
</header>
