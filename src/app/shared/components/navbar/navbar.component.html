<header class="navbar-header" [class.is-scrolled]="isScrolled()">
  <nav class="navbar-container">

    <!-- BRANDING -->
    <a [routerLink]="['/']" class="navbar-brand" (click)="closeMenus()">
      <div class="brand-company">
        <img src="assets/images/logo.png" alt="NFC-Soft Logo" class="brand-logo">
      </div>
      <div class="brand-divider"></div>
      <div class="brand-personal">
        <span class="person-name">Humberto Lozano</span>
        <span class="person-role">Backend Developer</span>
      </div>
    </a>

    <!-- Botón Hamburguesa -->
    <button
      class="mobile-toggle"
      (click)="toggleMobileMenu()"
      [attr.aria-expanded]="isMobileMenuOpen()"
      aria-label="Abrir menú de navegación">
      <span class="hamburger-bar"></span>
      <span class="hamburger-bar"></span>
      <span class="hamburger-bar"></span>
    </button>

    <!-- Menú Principal -->
    <div class="navbar-links" [class.active]="isMobileMenuOpen()">
      <ul>
        <li>
          <a
            [routerLink]="['/informacion-personal']"
            routerLinkActive="active-link"
            (click)="closeMenus()">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor">
              <path d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"/>
            </svg>
            Información Personal
          </a>
        </li>

        <li>
          <a
            [routerLink]="['/proyectos']"
            routerLinkActive="active-link"
            (click)="closeMenus()">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor">
              <path d="M10 4H4c-1.1 0-2 .9-2 2v12c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2V8c0-1.1-.9-2-2-2h-8l-2-2z"/>
            </svg>
            Proyectos & Código
          </a>
        </li>

        <!-- LOGIN / USUARIO -->
        <li class="login-item">
          <!-- Si NO está autenticado -->
          <button
            *ngIf="!auth.isAuthenticated()"
            class="login-link"
            (click)="openLogin('login')">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor">
              <path d="M11 7L9.6 8.4l2.6 2.6H2v2h10.2l-2.6 2.6L11 17l5-5-5-5zm9 12h-8v2h8c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2h-8v2h8v14z"/>
            </svg>
            Login
          </button>

          <!-- Si YA está autenticado -->
          <div *ngIf="auth.isAuthenticated()" class="user-menu">
            <button class="user-chip" (click)="logout()" title="Cerrar sesión">
              <span class="user-avatar">
                {{ auth.currentUser()?.fullName?.charAt(0) || 'U' }}
              </span>
              <span class="user-name">{{ auth.currentUser()?.fullName }}</span>
              <svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor">
                <path d="M11 7L9.6 8.4l2.6 2.6H2v2h10.2l-2.6 2.6L11 17l5-5-5-5zm9 12h-8v2h8c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2h-8v2h8v14z"/>
              </svg>
            </button>
          </div>
        </li>
      </ul>
    </div>

  </nav>
</header>
