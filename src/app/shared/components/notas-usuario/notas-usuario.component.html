<section class="notas" [class.notas--compacto]="compacto()" aria-label="Pensamiento del perfil">
  @if (editando()) {
    <div class="nota nota--editando">
      <input
        #campo
        type="text"
        class="nota__campo"
        [attr.maxlength]="limite"
        [value]="texto()"
        placeholder="¿Qué estás pensando?"
        (input)="texto.set($any($event.target).value)"
        (keydown.enter)="guardar($event)"
        (keydown.escape)="cancelar()"
        (blur)="guardar()" />

      <span class="nota__contador">{{ texto().length }}/{{ limite }}</span>

      <button type="button" class="nota__ok" (mousedown)="guardar($event)" title="Guardar" aria-label="Guardar">
        <i class="fa-solid fa-check" aria-hidden="true"></i>
      </button>
    </div>
  } @else if (nota() || propietario()) {
    <div class="nota">
      <i class="nota__icono fa-solid fa-pen" aria-hidden="true"></i>

      @if (propietario()) {
        <button type="button" class="nota__texto" (click)="abrir()"
                [title]="nota() ? 'Editar tu pensamiento' : 'Escribe lo que estás pensando'">
          {{ nota() || '¿Qué estás pensando?' }}
        </button>

        @if (nota()) {
          <button type="button" class="nota__quitar" (click)="quitar()" title="Quitar el pensamiento"
                  aria-label="Quitar el pensamiento">
            <i class="fa-solid fa-xmark" aria-hidden="true"></i>
          </button>
        }
      } @else {
        <span class="nota__texto nota__texto--lectura">{{ nota() }}</span>
      }
    </div>
  }
</section>
