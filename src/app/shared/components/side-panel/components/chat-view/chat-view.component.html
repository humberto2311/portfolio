<div class="messages" #messagesContainer>
  @for (msg of messages; track $index) {
    <div class="msg-row" [class.mine]="msg.sender === 'me'">
      <div class="bubble"
        [class.me]="msg.sender === 'me'"
        [class.ai]="msg.sender === 'them' && svc.activeContact()?.isAi"
        [class.them]="msg.sender === 'them' && !svc.activeContact()?.isAi">
        {{ msg.text }}
      </div>
      <span class="msg-time">{{ msg.time }}</span>
    </div>
  }
</div>

@if (svc.typing()) {
  <div class="typing">
    <span>{{ svc.typingName() }}</span> está escribiendo
    <span class="dots"><span></span><span></span><span></span></span>
  </div>
}

<form class="input-area" (ngSubmit)="send()">
  <input type="text" placeholder="Escribe un mensaje..." autocomplete="off"
    [ngModel]="message()" (ngModelChange)="message.set($event)"
    (keydown)="onKeyDown($event)" name="message" />
  <button type="submit"><i class="fa-solid fa-paper-plane"></i></button>
</form>
