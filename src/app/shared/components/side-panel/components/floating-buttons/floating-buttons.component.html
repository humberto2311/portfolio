<div class="fab-container">
  <div class="fab-wrap">
    <button class="fab fab-contacts" (click)="svc.openContacts()">
      <!-- Icono de Contacto en SVG -->
      <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>
        <circle cx="12" cy="7" r="4"></circle>
      </svg>
    </button>
    <span class="tooltip">Contactos</span>
  </div>

  <div class="fab-wrap">
    <button class="fab fab-ai" (click)="svc.openChat(svc.aiContact)">
      <!-- Icono de IA en SVG -->
      <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M12 3v1m0 16v1m9-9h-1M4 12H3m15.364 6.364l-.707-.707M6.343 6.343l-.707-.707m12.728 0l-.707.707M6.343 17.657l-.707.707M16 12a4 4 0 1 1-8 0 4 4 0 0 1 8 0z"></path>
      </svg>
    </button>
    <span class="tooltip ai-tooltip">Asistente IA</span>
  </div>
</div>
