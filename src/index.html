<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <title>NFC-Soft</title>
  <base href="/">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/devicons/devicon@latest/devicon.min.css">
  <meta name="viewport" content="width=device-width, initial-scale=1">
<link  rel="icon" type="image/png" href="/assets/images/miniatura.png">

  <script src="assets/config.js"></script>
  <script>
    (function () {
      try {
        var claro = localStorage.getItem('nfc-soft.tema') === 'claro' && !localStorage.getItem('token');
        document.documentElement.dataset.tema = claro ? 'claro' : 'oscuro';
      } catch (error) {}
    })();
  </script>
</head>
<body>
  <app-root></app-root>
</body>
</html>
